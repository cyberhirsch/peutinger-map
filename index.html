<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabula Peutingeriana Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3b2412; --red:#a8261b; --parch:#efe0b9; --parch2:#e2cc96; --sea:#9fb59a; --panel:#fbf5e6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:'IM Fell English', Georgia, serif; color:var(--ink); background:#2a1c10; }
  #app { display:flex; height:100%; }
  aside { width:300px; background:var(--panel); display:flex; flex-direction:column; border-right:2px solid var(--parch2); z-index:500; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--parch2); }
  h1 { font-family:'Cinzel', serif; font-size:18px; margin:0 0 8px; letter-spacing:.04em; }
  .toggle { display:flex; border:1px solid var(--ink); border-radius:6px; overflow:hidden; }
  .toggle button { flex:1; padding:7px; border:0; background:transparent; font:inherit; cursor:pointer; color:var(--ink); }
  .toggle button.on { background:var(--ink); color:var(--panel); }
  #search { width:100%; margin-top:10px; padding:7px 9px; font:inherit; border:1px solid var(--parch2); border-radius:6px; background:#fff; }
  #list { list-style:none; margin:0; padding:0; overflow-y:auto; flex:1; }
  #list li { padding:7px 16px; cursor:pointer; border-bottom:1px solid #eee2c4; }
  #list li:hover { background:#f3e6c4; }
  #list li.sel { background:var(--ink); color:var(--panel); }
  #list small { opacity:.7; }
  #info { padding:12px 16px; border-top:1px solid var(--parch2); min-height:120px; font-size:14px; }
  #info h2 { font-family:'Cinzel', serif; font-size:16px; margin:0 0 4px; color:var(--red); }
  #map { flex:1; }
  #map.peut { background:#3a2a1a; }
  #list li.off { opacity:.55; }
  .ring { width:30px; height:30px; border-radius:50%; border:3px solid #1d4fa8; box-shadow:0 0 0 2px #fff8; }
  .ring.sel { animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 #1d4fa8aa; } 100% { box-shadow:0 0 0 18px #1d4fa800; } }
  .filters { display:flex; gap:10px; font-size:13px; margin-top:8px; flex-wrap:wrap; }
  .filters label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .d0 { background:#1d4fa8; } .d1 { background:#2e8b57; } .d2 { background:#d08a1c; } .d3 { background:#9b59b6; } .dn { background:#999; }
  #count { font-size:12px; opacity:.7; padding:4px 16px; }
  .filters select { font:inherit; font-size:13px; border:1px solid var(--parch2); border-radius:4px; background:#fff; color:var(--ink); }
  .conf { margin-top:8px; padding:6px 8px; background:#f3e9cf; border-radius:6px; }
  .bar { display:inline-block; width:70px; height:6px; background:#e2d3ad; border-radius:3px; vertical-align:middle; margin-left:6px; overflow:hidden; }
  .bar i { display:block; height:100%; }
  .reasons { margin:4px 0 0 16px; padding:0; font-size:12px; opacity:.85; }
  .legs { width:100%; border-collapse:collapse; font-size:12px; margin-top:4px; }
  .legs td, .legs th { padding:2px 4px 2px 0; text-align:left; vertical-align:top; }
  .legs th { font-weight:normal; opacity:.7; border-bottom:1px solid var(--parch2); }
  .legs td.n { text-align:right; white-space:nowrap; }
  .legs .r { font-weight:bold; }
  #info { max-height:55%; overflow-y:auto; }
  .note { font-size:11px; opacity:.7; padding:6px 16px 10px; }
  @media (max-width:700px) {
    #app { flex-direction:column; }
    aside { width:100%; height:45%; border-right:0; border-bottom:2px solid var(--parch2); }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>Tabula Peutingeriana</h1>
      <div class="toggle">
        <button id="bPeut" class="on">Peutinger</button>
        <button id="bOsm">OpenStreetMap</button>
      </div>
      <input id="search" placeholder="Search place (Latin or modern)…">
      <div class="filters">
        <label><input type="checkbox" id="fAll"> all places</label>
        <label><input type="checkbox" id="fDots" checked> show markers</label>
        <label>colour by <select id="fColour"><option value="method">how placed</option><option value="conf">confidence</option></select></label>
        <label><input type="checkbox" id="fAcc" checked> colour roads by discrepancy</label>
        <label><input type="checkbox" id="fStreets" checked> modern streets</label>
      </div>
    </header>
    <div id="count"></div>
    <ul id="list"></ul>
    <div id="info"><em>Select a city to locate it.</em></div>
    <div class="note">Scan: Konrad Miller's 1887 facsimile. Places &amp; roads: <a href="https://omnesviae.org" target="_blank">OmnesViae</a> (after Talbert). Identifiers: <a href="https://vici.org" target="_blank">Vici.org</a>, <a href="https://pleiades.stoa.org" target="_blank">Pleiades</a> (CC BY). Road courses: <a href="https://itiner-e.org" target="_blank">Itiner-e</a> (CC BY).<br><span id="legend"></span></div>
  </aside>
  <div id="map" class="peut"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const W = 26381, H = 2014, STRIP = 2048;
const COL = ['#1d4fa8', '#2e8b57', '#d08a1c', '#9b59b6', '#16a0a0'];
const CONF = ['placed by hand', 'found on the scan (label or symbol)', 'estimated along the road between neighbours', 'somewhere in its grid square (label not found)', 'unnamed station, placed from the road layout'];
const BANDS = [[85, 'High', '#2e8b57'], [65, 'Medium', '#d4a017'], [40, 'Low', '#e06b1c'], [0, 'Very low', '#c0392b']];
const LQ = ['unknown (no modern coordinates)', 'approximate', 'identified', 'precise (OmnesViae and Pleiades agree within 5 km)'];
const band = q => BANDS.find(([t]) => q >= t);
const colourOf = p => $('fColour').value === 'conf'
  ? (p.q != null ? band(p.q)[2] : '#999')
  : (p.c != null ? COL[p.c] : '#999');
const dot = p => `<span class="dot" style="background:${colourOf(p)}"></span>`;
function renderLegend() {
  const items = $('fColour').value === 'conf'
    ? [...BANDS.map(([t, n, c]) => [c, `${n} confidence`]), ['#999', 'not on the Table']]
    : [...['placed by hand', 'found on scan', 'estimated along road', 'within its grid square', 'unnamed station'].map((n, i) => [COL[i], n, i])
        .filter(([, , i]) => PLACES.some(p => p.c === i)), ['#999', 'not on the Table']];
  $('legend').innerHTML = items.map(([c, n]) => `<span class="dot" style="background:${c}"></span>${n}`).join(' ')
    + ($('fAcc').checked ? '<br>Roads, real vs. Table length: ' + [...ACC.map(([, , c, n]) => [c, n]), ['#888', 'no distance']]
      .map(([c, n]) => `<span class="dot" style="background:${c}"></span>${n}`).join(' ') + '' : '')
    + (mode === 'osm' ? '<br>Road course (Itiner-e): bold certain · solid conjectured · dashed hypothetical · dotted off-road · long dashes: no Itiner-e road (straight line)' : '');
}
const pxy = ([x, y]) => [-y, x]; // CRS.Simple: [lat=-y, lng=x]
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap contributors' });
// terrain without modern roads or towns
const terrain = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 18, maxNativeZoom: 9, attribution: 'Tiles © Esri — Source: USGS, Esri, TANA, DeLorme, and NPS' });
// Table vs. real length: real road km / (Table number × unit)
// discrepancy, as real ÷ Table: [lower, upper, colour, label]
const ACC = [[0, 1 / 1.35, '#2b5fa8', 'real >35% shorter'], [1 / 1.35, 1 / 1.15, '#7fb0dd', '15–35% shorter'],
  [1 / 1.15, 1.15, '#2e8b57', 'within 15%'], [1.15, 1.35, '#e69a1c', '15–35% longer'], [1.35, Infinity, '#c0392b', 'real >35% longer']];
// Itiner-e certainty per segment: 0 off-road, 1 hypothetical, 2 conjectured, 3 certain
const CSTYLE = [w => ({ weight: Math.max(w - .5, 1.5), dashArray: '1 5' }), w => ({ weight: w, dashArray: '7 5' }),
  w => ({ weight: w }), w => ({ weight: w + 1.5 })];
const UNIT = { m: ['Roman miles', 'mp'], l: ['Gallic leagues', 'leugae'] };
const ratio = r => r && r.rk && (r.km ?? r.sk) / r.rk;
const accOf = q => q ? ACC.find(([lo, hi]) => q >= lo && q < hi) : null;
const accCol = q => (accOf(q) || [, , '#888'])[2];
const roman = n => { let s = ''; for (const [v, c] of [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]) while (n >= v) { s += c; n -= v; } return s; };
function decode(str) { // Google encoded polyline, precision 5
  const out = []; let i = 0, la = 0, lo = 0;
  while (i < str.length) {
    for (const k of [0, 1]) {
      let b, sh = 0, v = 0;
      do { b = str.charCodeAt(i++) - 63; v |= (b & 31) << sh; sh += 5; } while (b >= 32);
      v = v & 1 ? ~(v >> 1) : v >> 1;
      if (k) lo += v; else la += v;
    }
    out.push([la / 1e5, lo / 1e5]);
  }
  return out;
}
let ROUTES = [];
let PLACES = [], ROADS = [], mode = 'peut', layers, selLayer, selected = null, selRoad = null;
const $ = id => document.getElementById(id);

const pos = p => mode === 'peut' ? (p.xy && pxy(p.xy)) : p.ll;

function draw() {
  layers.clearLayers();
  const P = mode === 'peut';
  if (P) for (let i = 0, x = 0; x < W; i++, x += STRIP)
    L.imageOverlay(`strip_${String(i).padStart(2, '0')}.jpg`, [pxy([x, H]), pxy([Math.min(x + STRIP, W), 0])]).addTo(layers);
  else {
    const acc = $('fAcc').checked, rr = L.canvas({ padding: .3, tolerance: 5 });
    ROADS.forEach(([a, b, d], k) => {
      if (!PLACES[a].ll || !PLACES[b].ll) return;
      const r = ROUTES[k], g = r && r.line, sel = selRoad === k || selected === a || selected === b;
      const col = acc ? accCol(ratio(r)) : '#a8261b';
      const w = selRoad === k ? 7 : sel ? 5 : 2, o = sel ? .95 : .7;
      if (selRoad === k) L.polyline(g || [PLACES[a].ll, PLACES[b].ll], { renderer: rr, color: '#3b2412', weight: w + 5, opacity: .45, interactive: false }).addTo(layers);
      const part = (pts, st) => L.polyline(pts, { renderer: rr, color: col, ...st })
        .bindTooltip(() => legHtml(k, a), { sticky: true }).on('click', e => { L.DomEvent.stop(e); selectRoad(k); }).addTo(layers);
      if (!g) { part([PLACES[a].ll, PLACES[b].ll], { weight: w * .75, opacity: o, dashArray: '14 7' }); return; }
      // 2-bit confidence per vertex (Itiner-e certainty of the segment starting there): one polyline per run
      for (let i = 0; i < g.length - 1;) {
        const c = r.c ? +r.c[i] : 2; let j = i + 1;
        while (j < g.length - 1 && r.c && +r.c[j] === c) j++;
        part(g.slice(i, j + 1), { ...CSTYLE[c](w), opacity: c ? o : o * .7 });
        i = j;
      }
    });
  }
  if (!$('fDots').checked) return;
  const r = L.canvas({ padding: .3 });
  PLACES.forEach((p, i) => {
    const ll = pos(p); if (!ll) return;
    L.circleMarker(ll, { renderer: r, radius: p.k ? 6 : 4, weight: 1.5, color: '#fff', fillOpacity: .9,
      fillColor: colourOf(p) })
      .bindTooltip(p.n + (p.m ? ` — ${p.m}` : '')).on('click', () => select(i)).addTo(layers);
  });
}

function drawSel() {
  selLayer.clearLayers();
  if (selected == null) return;
  const ll = pos(PLACES[selected]); if (!ll) return;
  L.marker(ll, { interactive: false, icon: L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15], html: '<div class="ring sel"></div>' }) }).addTo(selLayer);
}

function setMode(m) {
  mode = m;
  $('bPeut').classList.toggle('on', m === 'peut');
  $('bOsm').classList.toggle('on', m === 'osm');
  rebuildMap(); renderLegend();
  if (selected != null) fly(PLACES[selected], false);
}

function rebuildMap() {
  // Leaflet can't change CRS on the fly, so recreate the map
  window.lmap && window.lmap.remove();
  const el = $('map'); el.className = mode;
  const P = mode === 'peut';
  const lm = L.map(el, P ? { crs: L.CRS.Simple, minZoom: -4, maxZoom: 1.5, zoomSnap: .25,
      maxBounds: [pxy([-500, H + 300]), pxy([W + 500, -300])] } : { zoomSnap: .25, preferCanvas: true });
  window.lmap = lm;
  layers = L.layerGroup().addTo(lm); selLayer = L.layerGroup().addTo(lm);
  if (!P) ($('fStreets').checked ? osm : terrain).addTo(lm);
  draw(); drawSel();
  if (P) lm.fitBounds([pxy([0, H]), pxy([4000, 0])]);
  else lm.fitBounds([[28, -6], [52, 45]]);
}

function fly(p, animate = true) {
  const ll = pos(p); if (!ll) return;
  window.lmap.flyTo(ll, mode === 'peut' ? Math.max(window.lmap.getZoom(), 0) : 9, { animate });
}

function select(i) {
  selected = i; selRoad = null;
  const p = PLACES[i];
  drawSel(); fly(p);
  renderList($('search').value);
  if (mode === 'osm') draw();
  const near = ROADS.map((r, k) => [r, k]).filter(([r]) => r[0] === i || r[1] === i).map(([[a, b, d], k]) => {
    const j = a === i ? b : a, r = ROUTES[k], q = ratio(r), c = accOf(q);
    const real = r?.km != null ? `${Math.round(r.km)} km` : r ? `<span title="straight line, no Itiner-e road">~${Math.round(r.sk)} km</span>` : '–';
    return `<tr><td><a href="#" data-i="${j}">${PLACES[j].n}</a> <a href="#" data-k="${k}" title="select this road">›</a></td>
      <td class="n">${d ? `${roman(d)} <small>${r ? UNIT[r.u][1] : ''}</small>${r?.rk ? `<br><small>${Math.round(r.rk)} km</small>` : ''}` : '–'}</td>
      <td class="n">${real}</td>
      <td class="n r" style="color:${accCol(q)}">${q ? q.toFixed(2) : '–'}</td></tr>`;
  });
  $('info').innerHTML = `<h2>${p.k || p.n}</h2>
    ${p.k && p.k !== p.n ? `<div>On the Table: <em>${p.n}</em></div>` : ''}
    ${p.m ? `<div><strong>Today:</strong> ${p.m}</div>` : ''}
    ${p.ll ? `<div><small>${p.ll[0].toFixed(2)}°, ${p.ll[1].toFixed(2)}°</small></div>` : ''}
    <div><small><span class="dot" style="background:${p.c != null ? COL[p.c] : '#999'}"></span>${p.c != null ? CONF[p.c] : 'not on the surviving Table'}</small>${p.g ? ` <small>· Talbert grid ${p.g.join(', ')}</small>` : ''}</div>
    ${p.q != null ? `<div class="conf"><strong>Position on the scan:</strong> ${band(p.q)[1]} <small>(${p.q}/100)</small><span class="bar"><i style="width:${p.q}%;background:${band(p.q)[2]}"></i></span>
      <ul class="reasons">${(p.qr || []).map(r => `<li>${r}</li>`).join('')}</ul></div>` : ''}
    <div style="margin-top:4px"><small><strong>Real-world location:</strong> ${LQ[p.lq ?? 0]}${p.dk ? ` · OmnesViae and Pleiades differ by ${p.dk} km` : ''}${p.lls ? ` · map position from ${p.lls}` : ''}</small></div>
    ${links(p)}
    ${p.note ? `<p>${p.note}</p>` : ''}
    ${near.length ? `<table class="legs"><tr><th>Road to</th><th class="n">Table</th><th class="n">Real</th><th class="n" title="real ÷ Table">ratio</th></tr>${near.join('')}</table>` : ''}`;
}

function selectRoad(k) {
  selRoad = k; selected = null;
  const [a, b, d] = ROADS[k], r = ROUTES[k] || {}, q = ratio(r), real = r.km ?? r.sk;
  drawSel(); renderList($('search').value); draw();
  if (mode === 'osm' && r.sk != null) window.lmap.flyToBounds(L.latLngBounds(r.line || [PLACES[a].ll, PLACES[b].ll]), { padding: [40, 40], maxZoom: 11 });
  const diff = r.rk && real != null ? real - r.rk : null;
  const cert = r.cert ? ['certain', 'conjectured', 'hypothetical', 'off-road'].map((n, i) => r.cert[i] ? `<li>${Math.round(r.cert[i] * 100)}% ${n}</li>` : '').join('') : '';
  $('info').innerHTML = `<h2>Road</h2>
    <div><a href="#" data-i="${a}">${PLACES[a].k || PLACES[a].n}</a> – <a href="#" data-i="${b}">${PLACES[b].k || PLACES[b].n}</a></div>
    <table class="legs">
      <tr><td>Expected (Table)</td><td class="n">${d ? `${roman(d)} ${UNIT[r.u || 'm'][1]}${r.rk ? ` = <b>${r.rk.toFixed(1)} km</b>` : ''}` : 'no distance'}</td></tr>
      ${r.uq ? '<tr><td colspan="2"><small>Unit uncertain beyond the Euphrates; read as Roman miles</small></td></tr>' : ''}
      <tr><td>${r.km != null ? 'Current (along the Roman road)' : 'Current (straight line, no Itiner-e road)'}</td><td class="n"><b>${real != null ? real.toFixed(1) + ' km' : '–'}</b></td></tr>
      ${diff != null ? `<tr><td>Difference</td><td class="n r" style="color:${accCol(q)}">${diff > 0 ? '+' : ''}${diff.toFixed(1)} km (${diff > 0 ? '+' : ''}${Math.round((q - 1) * 100)}%)</td></tr>` : ''}
      ${r.km != null ? `<tr><td>Straight line</td><td class="n">${r.sk.toFixed(1)} km</td></tr>` : ''}
    </table>
    ${cert ? `<div style="margin-top:6px"><small><strong>Itiner-e certainty along the route:</strong></small><ul class="reasons">${cert}</ul></div>` : ''}
    ${r.dt ? '<p><small>Long detour: probably a gap in Itiner-e or a sea crossing.</small></p>' : ''}`;
}

function legHtml(k, from) {
  const [a, b, d] = ROADS[k], r = ROUTES[k] || {}, q = ratio(r);
  const [x, y] = from === b ? [b, a] : [a, b];
  const cert = r.cert ? ['certain', 'conjectured', 'hypothetical', 'off-road'].map((n, i) => r.cert[i] ? `${Math.round(r.cert[i] * 100)}% ${n}` : '').filter(Boolean).join(', ') : '';
  return `<b>${PLACES[x].n} – ${PLACES[y].n}</b><br>
    Table: ${d ? `${roman(d)} = ${d} ${UNIT[r.u || 'm'][0]}${r.rk ? ` ≈ ${Math.round(r.rk)} km` : ''}${r.uq ? ' (unit uncertain)' : ''}` : 'no distance'}<br>
    ${r.km != null ? `Along the Roman road: ${Math.round(r.km)} km <small>(${cert})</small>` : `No Itiner-e road; straight line ${Math.round(r.sk)} km`}<br>
    Straight line: ${Math.round(r.sk)} km${q ? `<br>Real ÷ Table: <b style="color:${accCol(q)}">${q.toFixed(2)}</b>` : ''}
    ${r.dt ? '<br><small>Long detour: probably a gap in Itiner-e or a sea crossing</small>' : ''}`;
}

function links(p) {
  const x = p.ids || {}; const out = [];
  if (x.v) out.push(`<a href="https://vici.org/vici/${x.v}/" target="_blank" rel="noopener">Vici</a>`);
  if (x.p) out.push(`<a href="https://pleiades.stoa.org/places/${x.p}" target="_blank" rel="noopener">Pleiades${p.pt ? ': ' + p.pt : ''}</a>`);
  if (x.w) out.push(`<a href="https://www.wikidata.org/wiki/${x.w}" target="_blank" rel="noopener">Wikidata</a>`);
  if (x.l) out.push(`<a href="https://www.livius.org/place/${x.l}/" target="_blank" rel="noopener">Livius</a>`);
  if (x.d) out.push(`<a href="https://dare.ht.lu.se/places/${x.d}" target="_blank" rel="noopener">DARE</a>`);
  if (!out.length) return '';
  return `<div style="margin-top:4px"><small><strong>Linked data:</strong> ${out.join(' · ')}${p.vt ? ` · <em>${p.vt}</em>` : ''}</small></div>`;
}

function renderList(q = '') {
  q = q.toLowerCase().trim();
  const all = $('fAll').checked || q;
  let rows = PLACES.map((p, i) => [p, i]).filter(([p]) => all ? true : p.k);
  if (q) rows = rows.filter(([p]) => (p.n + ' ' + (p.k || '') + ' ' + (p.m || '')).toLowerCase().includes(q));
  rows.sort((a, b) => (a[0].k || a[0].n).localeCompare(b[0].k || b[0].n));
  $('count').textContent = `${rows.length} place${rows.length === 1 ? '' : 's'}`;
  $('list').innerHTML = rows.slice(0, 300).map(([p, i]) =>
    `<li data-i="${i}" class="${i === selected ? 'sel' : ''}">${dot(p)}${p.k || p.n}<br><small>${p.k ? p.n + ' · ' : ''}${p.m || ''}</small></li>`).join('')
    + (rows.length > 300 ? `<li><small>…refine the search to see more</small></li>` : '');
  document.querySelector('#list li.sel')?.scrollIntoView({ block: 'nearest' });
}

$('list').addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) select(+li.dataset.i); });
$('info').addEventListener('click', e => {
  const a = e.target.closest('a[data-i], a[data-k]'); if (!a) return;
  e.preventDefault(); a.dataset.k != null ? selectRoad(+a.dataset.k) : select(+a.dataset.i);
});
$('search').addEventListener('input', e => renderList(e.target.value));
$('fAll').onchange = () => renderList($('search').value);
$('fDots').onchange = () => draw();
$('fAcc').onchange = () => { renderLegend(); draw(); };
$('fStreets').onchange = () => { if (mode !== 'osm') return; const on = $('fStreets').checked;
  window.lmap.removeLayer(on ? terrain : osm); (on ? osm : terrain).addTo(window.lmap); };
$('fColour').onchange = () => { renderLegend(); draw(); renderList($('search').value); };
$('bPeut').onclick = () => mode !== 'peut' && setMode('peut');
$('bOsm').onclick = () => mode !== 'osm' && setMode('osm');

// revalidate so data updates show up immediately
Promise.all([
  fetch('places.json', { cache: 'no-cache' }).then(r => r.json()),
  fetch('routes.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ routes: [] })),
]).then(([d, rt]) => {
  PLACES = d.places; ROADS = d.roads;
  ROUTES = rt.routes.map(r => r && (r.g ? { ...r, line: decode(r.g) } : r));
  renderLegend(); renderList(); rebuildMap();
});
</script>
</body>
</html>
